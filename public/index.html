<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Economía Argentina</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="./stylesheets/style.css" />
</head>

<body>
    <header class="text-center">
        <h1>Economía Argentina</h1>
        <p>Datos clave que impactan en tu vida</p>
    </header>
    <main class="container my-5">
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card data-card">
                    <div class="card-header">Salario Mínimo</div>
                    <div class="card-body">
                        <p class="card-text">Valor actual: <strong id="salarioMinimo">0,0</strong></p>
                        <small class="text-muted">Actualizado: <span id="salarioMinimoUpdated"></span></small>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card data-card">
                    <div class="card-header">Canasta Básica</div>
                    <div class="card-body">
                        <p class="card-text">Alimentaria: <strong id="canastaAlimentaria">0,0</strong></p>
                        <p class="card-text">Total: <strong id="canastaTotal">0,0</strong></p>
                        <small class="text-muted">Actualizado: <span id="canastaTotalUpdated"></span></small>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card data-card">
                    <div class="card-header">Jubilaciones</div>
                    <div class="card-body">
                        <p class="card-text">Haber mínimo: <strong id="jubilacion">0,0</strong></p>
                        <small class="text-muted">Actualizado: <span id="jubilacionUpdated"></span></small>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="text-center">
        <p>Fuentes: INDEC, ANSES, Ministerio de Trabajo</p>
        <p>&copy; 2024 Economía Argentina</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="./javascripts/client-app.js"></script>
</body>

</html>
